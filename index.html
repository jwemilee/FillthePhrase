<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Small Talk GO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Doto:wght@800&display=swap">
<style>
:root{--bg1:#f8f8f9;--bg2:#e9e9ed;--glow:rgba(255,95,255,.17);--card:#fff;--row:#f3f3f5;--dotoff:#d3d3d9;--ink:#15161a;--muted:#8a8b94;--line:#dcdce2;--accent:#FF5FFF;--good:#169a63;--bad:#e5484d;--g1:rgba(255,255,255,.78);--g2:rgba(255,255,255,.3);--gbd:rgba(255,255,255,.95);--btn:#17181c;--cs:0 1px 2px rgba(0,0,0,.04),0 28px 60px rgba(40,20,50,.11);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#16171c;--bg2:#0e0f12;--glow:rgba(255,95,255,.14);--card:#1c1d23;--row:#272830;--dotoff:#40414b;--ink:#f2f2f5;--muted:#8d8e99;--line:#34353e;--good:#4cd08c;--bad:#ff7d7d;--g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.04);--gbd:rgba(255,255,255,.2);--btn:#f2f2f5;--cs:0 28px 60px rgba(0,0,0,.45)}}
:root[data-theme="dark"]{--bg1:#16171c;--bg2:#0e0f12;--glow:rgba(255,95,255,.14);--card:#1c1d23;--row:#272830;--dotoff:#40414b;--ink:#f2f2f5;--muted:#8d8e99;--line:#34353e;--good:#4cd08c;--bad:#ff7d7d;--g1:rgba(255,255,255,.14);--g2:rgba(255,255,255,.04);--gbd:rgba(255,255,255,.2);--btn:#f2f2f5;--cs:0 28px 60px rgba(0,0,0,.45)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;color:var(--ink);font-family:Inter,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
background:radial-gradient(60% 50% at 80% 90%,var(--glow),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2));background-attachment:fixed}
#app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;justify-content:center;padding:16px;gap:16px}
#arena{position:relative;isolation:isolate;display:flex;flex-direction:column;background:var(--card);border-radius:28px;box-shadow:var(--cs);padding:24px;min-height:470px;overflow:hidden}
#qa{position:relative;flex:1;display:flex;flex-direction:column;justify-content:center;padding:22px 0}
#qa::before{content:"";position:absolute;left:50%;top:50%;width:92%;height:78%;transform:translate(-50%,-50%);z-index:-1;pointer-events:none;background:radial-gradient(closest-side,rgba(255,95,255,.4),rgba(110,140,255,.2) 62%,transparent);filter:blur(26px)}
#head{display:flex;align-items:center;gap:14px}
#ic{width:48px;height:48px;border-radius:50%;background:var(--row);display:grid;place-items:center;flex:none}
#ic svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stg{font-size:18px;font-weight:600;letter-spacing:-.02em}
#sub{font-size:13px;color:var(--muted);margin-top:2px}
#sc{margin-left:auto;font-family:Doto,ui-monospace,monospace;font-weight:800;font-size:34px;letter-spacing:.02em;line-height:1}
#timer{display:flex;justify-content:space-between;align-items:center;height:10px;margin:20px 2px 4px}
#timer i{width:7px;height:7px;border-radius:50%;background:var(--dotoff);transform:scale(.5);transition:transform .15s,background .15s}
#timer i.on{background:var(--accent);transform:scale(1)}
#timer.low i.on{animation:pu .7s infinite alternate}
@keyframes pu{to{transform:scale(.7)}}
#tt{font-size:12px;color:var(--muted);min-height:16px;margin:0 2px}
#ko{font-size:21px;font-weight:700;text-align:center;margin:0 0 10px;line-height:1.45;letter-spacing:-.02em}
#en{font-size:25px;text-align:center;line-height:1.8;font-weight:600;letter-spacing:-.02em}
.blank{display:inline-block;height:1.15em;border-radius:12px;vertical-align:text-bottom;color:transparent;margin:0 3px;background:linear-gradient(180deg,var(--g1),var(--g2));backdrop-filter:blur(12px) saturate(1.6);-webkit-backdrop-filter:blur(12px) saturate(1.6);border:1px solid var(--gbd);box-shadow:0 6px 16px rgba(255,95,255,.28),inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 0 rgba(255,95,255,.6)}
#en.ok{color:var(--good)}#en.bad{color:var(--bad)}
#fb{position:absolute;left:0;right:0;bottom:2px;text-align:center;color:var(--muted);font-size:14px;min-height:20px}
#info{display:flex;align-items:center;gap:10px;background:var(--row);border-radius:16px;padding:10px 12px;font-size:14px;font-weight:500}
.mini{width:36px;height:26px;border-radius:8px;background:var(--btn);color:var(--card);display:grid;place-items:center;font-size:12px}
#hp{color:var(--accent);letter-spacing:3px;font-size:13px}
.chip{margin-left:auto;font:inherit;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;border:0;background:var(--card);color:var(--ink);cursor:pointer;box-shadow:0 0 0 1px var(--line)}
#bar{display:flex;align-items:center;gap:10px;margin-top:12px;background:var(--row);border-radius:999px;padding:6px 6px 6px 22px;transition:box-shadow .2s}
#bar:focus-within{box-shadow:0 0 0 2px var(--accent)}
#inp{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:18px;color:var(--ink);outline:none;padding:10px 0}
#inp::placeholder{color:var(--muted)}
#inp.shake{animation:sh .25s;color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#go{width:46px;height:46px;border-radius:50%;padding:0;font-size:20px;color:var(--card);background:var(--btn)}
button{font:inherit;font-weight:600;border:0;cursor:pointer;transition:transform .15s,box-shadow .2s,filter .2s,background .2s}
button:active{transform:scale(.95)}
#ctl{display:flex;justify-content:flex-end;gap:10px}
.out{padding:12px 24px;border-radius:999px;background:color-mix(in srgb,var(--card) 70%,transparent);color:var(--ink);box-shadow:0 0 0 1.5px var(--line);font-size:16px;font-weight:500}
.overlay{position:absolute;inset:0;background:radial-gradient(70% 38% at 50% 62%,rgba(255,95,255,.32),rgba(110,140,255,.14) 60%,transparent),var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;overflow:auto;z-index:3}
.overlay h1{margin:0 0 8px;font-size:26px;letter-spacing:-.02em}
.overlay p{margin:4px 0 18px;color:var(--muted);font-size:14px;line-height:1.6;max-width:400px}
.overlay button#s,.overlay button#re{padding:14px 30px;border-radius:999px;color:var(--card);background:var(--btn);font-size:16px}
.rev{text-align:left;width:100%;max-height:200px;overflow:auto;margin-bottom:18px;font-size:13.5px;background:linear-gradient(180deg,var(--g1),var(--g2));backdrop-filter:blur(16px) saturate(1.6);-webkit-backdrop-filter:blur(16px) saturate(1.6);border:1px solid var(--gbd);box-shadow:0 10px 28px rgba(255,95,255,.18),inset 0 1px 0 rgba(255,255,255,.7);border-radius:20px;padding:4px 16px}
.rev div{padding:9px 0;border-bottom:1px solid var(--line)}
.rev div:last-child{border:0}
.rev span{color:var(--muted);display:block;font-size:12px}
@media (hover:hover){
button:hover{transform:translateY(-2px)}
.chip:hover{box-shadow:0 0 0 1.5px var(--accent)}
.out:hover{box-shadow:0 0 0 1.5px var(--accent),0 10px 24px rgba(255,95,255,.18)}
#go:hover,.overlay button:hover{filter:brightness(1.35);box-shadow:0 10px 22px rgba(255,95,255,.35)}
}
button:active{transform:scale(.95)}
</style>
</head>
<body>
<div id="app">
  <div id="arena">
    <div id="head">
      <div id="ic"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1.1-4.6A8 8 0 1 1 21 12z"/></svg></div>
      <div><div id="stg">Stage 1/8</div><div id="sub"></div></div>
      <div id="sc">00000</div>
    </div>
    <div id="timer"></div><div id="tt"></div>
    <div id="qa"><div id="ko"></div><div id="en"></div><div id="fb"></div></div>
    <div id="info"><span class="mini">♥</span><span>Lives</span><span id="hp"></span><button id="hint" class="chip">힌트</button></div>
    <div id="bar"><input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="빈칸에 들어갈 말"><button id="go" aria-label="확인">→</button></div>
  </div>
  <div id="ctl"><button id="mu" class="out">♪ ON</button><button id="ky" class="out">⌨ ON</button></div>
</div>
<script src="sentences.js"></script>
<script>
const SIZES=[1,1,2,2,3,3,4,99],PER=5,MAXL=3;
const $=id=>document.getElementById(id),arena=$("arena"),inp=$("inp");
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[.,!?]/g,"").replace(/\s+/g," ").trim();
const full=it=>it[1].replace("___",it[2].split("|")[0]);
const ND=34,dots=[],tm=$("timer");
for(let i=0;i<ND;i++){const d=document.createElement("i");tm.appendChild(d);dots.push(d)}
function setDots(r){const n=Math.round(r*ND);dots.forEach((d,i)=>{d.className=i<n?"on":""});tm.classList.toggle("low",r<.25)}
let st,qi,lives,score,combo,deck,cur,tLeft,tMax,phase,missed,last,raf,nextFn,hinted;
function mk(it,size){
  const tk=full(it).split(" "),k=it[1].split(" ").findIndex(w=>w.includes("___"));
  size=Math.min(tk.length,size);
  let a=k,b=k,flip=false;
  while(b-a+1<size){if(a>0&&(flip||b>=tk.length-1))a--;else b++;flip=!flip}
  const lw=tk[b],tp=(lw.match(/[.,!?]+$/)||[""])[0];
  const words=tk.slice(a,b+1);words[words.length-1]=lw.slice(0,lw.length-tp.length);
  const ans=words.join(" ");
  const alts=size===1?it[2].split("|"):[ans];
  const esc=s=>s.replace(/[<>&]/g,"");
  const html=esc(tk.slice(0,a).join(" "))+(a?" ":"")+ans.split(" ").map(()=>'<span class="blank" style="min-width:52px">x</span>').join(" ")+esc(tp)+(b<tk.length-1?" ":"")+esc(tk.slice(b+1).join(" "));
  return {html,ans:alts,main:ans,words:words.length};
}
function hud(){
  $("stg").textContent="Stage "+(st+1)+"/"+SIZES.length;
  $("sub").textContent=Math.min(qi+1,PER)+" of "+PER+(combo>1?" · "+combo+" combo":"");
  $("sc").textContent=String(score).padStart(5,"0");
  $("hp").textContent="●".repeat(lives)+"○".repeat(MAXL-lives);
}
function overlay(html){const o=document.createElement("div");o.className="overlay";o.innerHTML=html;arena.appendChild(o);return o}
function clearOv(){arena.querySelectorAll(".overlay").forEach(o=>o.remove())}
function showStart(){
  $("ko").textContent="";$("en").textContent="";hud();
  overlay('<h1>Small Talk GO 🚩</h1><p>한 번에 한 문장씩 나옵니다. 제한 시간 안에 빈칸을 영어로 입력하세요. 5문제를 풀면 스테이지 클리어! 스테이지가 올라갈수록 빈칸이 한 단어 → 구 → 거의 문장 전체로 길어지고, 제한 시간도 그에 맞게 늘어납니다.<br>틀리면 시간이 2초 줄고, 시간 초과하면 목숨이 줄어요 (목숨 3개).</p><button id="s">출발!</button>');
  $("s").onclick=start;
}
function start(){
  musicStart();clearOv();deck=DATA.slice().sort(()=>Math.random()-.5);
  st=0;qi=0;lives=MAXL;score=0;combo=0;missed=[];nextQ();
}
function nextQ(){
  clearOv();if(qi===0)setTrack(st);
  if(qi>=PER){stageClear();return}
  const it=deck[st*PER+qi];cur={it,m:mk(it,SIZES[st])};
  $("ko").textContent=it[0];$("en").className="";$("en").innerHTML=cur.m.html;
  $("fb").textContent="";hinted=false;inp.value="";
  tMax=tLeft=10+cur.m.words*3;phase="q";hud();inp.focus();
  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function tick(t){
  if(phase!=="q")return;
  tLeft-=Math.min((t-last)/1000,.1);last=t;
  const r=Math.max(tLeft,0)/tMax;
  setDots(r);
  $("tt").textContent=Math.ceil(Math.max(tLeft,0))+"s";
  if(tLeft<=0){fail("시간 초과!");return}
  raf=requestAnimationFrame(tick);
}
function reveal(cls){
  $("en").className=cls;$("en").textContent=full(cur.it);
}
function fail(msg){
  phase="wait";lives--;combo=0;missed.push(cur.it);reveal("bad");hud();
  sfx("fail");$("fb").textContent=msg;
  const f=()=>{if(lives<=0)over(false);else{qi++;nextQ()}};
  nextFn=f;setTimeout(()=>{if(phase==="wait"&&nextFn===f)f()},2200);
}
function submit(){
  if(phase==="wait"){nextFn();return}
  if(phase!=="q")return;
  const v=norm(inp.value);if(!v)return;
  if(cur.m.ans.some(a=>norm(a)===v)){
    phase="fb";const bonus=Math.round(tLeft*10*(1+Math.min(combo,5)*.2));
    score+=bonus;combo++;reveal("ok");sfx("ok");hud();
    $("fb").textContent="정답! +"+bonus+(combo>1?" ("+combo+" 콤보)":"");
    nextFn=()=>{qi++;nextQ()};
    setTimeout(()=>{if(phase==="fb"){phase="wait";nextFn()}},1300);
  }else{
    sfx("no");tLeft-=2;combo=0;inp.classList.add("shake");setTimeout(()=>inp.classList.remove("shake"),260);inp.select();
  }
}
function hint(){
  if(phase!=="q"||hinted)return;hinted=true;tLeft-=3;
  $("fb").textContent="힌트: "+cur.m.main.split(" ").map(w=>w[0]+"_".repeat(w.length-1)).join(" ");
  inp.focus();
}
function stageClear(){
  st++;qi=0;
  if(st>=SIZES.length){over(true);return}
  hud();phase="none";
  overlay('<h1>Stage '+st+' Clear! 🎉</h1><p>현재 점수 '+score+'</p>');
  setTimeout(nextQ,1500);
}
function over(win){
  phase="none";
  const o=overlay('<h1>'+(win?"코스 클리어! 🏆":"Game Over")+'</h1><p>점수 '+score+' · 도달 Stage '+Math.min(st+1,SIZES.length)+'<br>'+(missed.length?"놓친 문장을 소리 내어 3번씩 읽어보세요.":"틀린 문장이 없어요!")+'</p><div class="rev"></div><button id="re">다시 하기</button>');
  const r=o.querySelector(".rev");
  missed.forEach(m=>{const d=document.createElement("div");d.textContent=full(m);const s=document.createElement("span");s.textContent=m[0];d.appendChild(s);r.appendChild(d)});
  if(!missed.length)r.remove();
  $("re").onclick=start;
}
let ac,musicOn=true,mTimer=null,mStep=0,mNext=0;
const hz=m=>440*Math.pow(2,(m-69)/12);
const TRACKS=[
{l:[69,72,76,72,69,72,76,0,74,77,81,77,74,77,81,0,72,76,79,76,72,76,79,0,71,74,77,74,76,0,72,0],b:[45,50,48,52]},
{l:[72,76,79,76,72,76,79,0,77,81,84,81,77,81,84,0,79,83,86,83,79,83,86,0,76,79,84,79,76,0,72,0],b:[48,53,55,48]},
{l:[74,0,77,74,81,0,77,74,72,0,76,72,79,0,76,72,70,0,74,70,77,0,74,70,69,72,76,72,69,0,0,0],b:[50,48,46,45]},
{l:[79,83,86,83,91,86,83,0,76,79,83,79,88,83,79,0,74,78,81,78,86,81,78,0,79,0,83,0,86,0,0,0],b:[43,40,38,43]}];
let trk=0,trans=0,stepD=.2;
function setTrack(n){trk=n%4;trans=n>=4?2:0;stepD=Math.max(.12,.21-n*.012);mStep=0}
function tone(f,t,d,type,g){const o=ac.createOscillator(),v=ac.createGain();o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function sched(){while(mNext<ac.currentTime+.3){const T=TRACKS[trk],s=mStep%32,L=T.l[s];if(L)tone(hz(L+trans),mNext,stepD*.85,"square",.03);if(s%2===0){const r=T.b[Math.floor(s/8)]+trans;tone(hz(s%4===0?r:r+7),mNext,stepD*1.5,"triangle",.075)}mNext+=stepD;mStep++}}
function musicStart(){if(!musicOn||mTimer)return;try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();mNext=ac.currentTime+.05;mTimer=setInterval(sched,60)}catch(e){}}
function musicStop(){clearInterval(mTimer);mTimer=null}
function sfx(k){if(!musicOn||!ac)return;const t=ac.currentTime;if(k==="ok"){tone(880,t,.08,"square",.06);tone(1320,t+.08,.12,"square",.06)}else if(k==="no")tone(180,t,.15,"sawtooth",.05);else{tone(220,t,.2,"sawtooth",.06);tone(150,t+.2,.3,"sawtooth",.06)}}
$("mu").onclick=()=>{musicOn=!musicOn;$("mu").textContent=musicOn?"♪ ON":"♪ OFF";if(musicOn)musicStart();else musicStop()};
let typeOn=true;
function keySound(e){
  if(!typeOn||e.ctrlKey||e.metaKey)return;
  const k=e.key;if(!(k.length===1||k==="Backspace"||k==="Enter"))return;
  try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();
  const t=ac.currentTime,r=Math.random();
  if(k==="Enter"){tone(260,t,.08,"square",.12);tone(90,t,.12,"triangle",.26)}
  else if(k==="Backspace"){tone(900+r*120,t,.04,"square",.08);tone(110,t,.06,"triangle",.18)}
  else{tone(1700+r*500,t,.04,"square",.1);tone(140+r*30,t,.06,"triangle",.22)}}catch(x){}
}
$("ky").onclick=()=>{typeOn=!typeOn;$("ky").textContent=typeOn?"⌨ ON":"⌨ OFF";inp.focus()};
inp.addEventListener("keydown",e=>{keySound(e);if(e.key==="Enter")submit()});
$("go").onclick=()=>{submit();inp.focus()};
$("hint").onclick=hint;
lives=MAXL;st=0;qi=0;score=0;showStart();
</script>
</body>
</html>
